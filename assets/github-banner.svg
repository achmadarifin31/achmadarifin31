<defs>
  <style>
    .banner-bg { fill: #0A0A0F; }
    .trace { stroke: #00B4FF; stroke-width: 1; fill: none; opacity: 0.18; }
    .trace-bright { stroke: #00B4FF; stroke-width: 1.5; fill: none; opacity: 0.45; }
    .trace-dim { stroke: #004466; stroke-width: 0.8; fill: none; opacity: 0.3; }
    .node-ring { fill: none; stroke: #00B4FF; }
    .node-dot { fill: #00B4FF; }
    .node-glow { fill: #00B4FF; opacity: 0.08; }
    .binary { fill: #00B4FF; font-family: 'Courier New', monospace; font-size: 11px; opacity: 0.07; }
    .name-text { fill: #FFFFFF; font-family: 'Courier New', monospace; font-weight: 700; font-size: 58px; letter-spacing: 6px; }
    .title-text { fill: #00B4FF; font-family: 'Courier New', monospace; font-weight: 400; font-size: 18px; letter-spacing: 5px; }
    .divider { stroke: #00B4FF; stroke-width: 1; opacity: 0.5; }
    .tag { fill: none; stroke: #00B4FF; stroke-width: 0.8; opacity: 0.5; }
    .tag-text { fill: #00B4FF; font-family: 'Courier New', monospace; font-size: 11px; opacity: 0.6; letter-spacing: 2px; }
    .corner { stroke: #00B4FF; stroke-width: 1.5; fill: none; opacity: 0.7; }
    .scan-line { stroke: #00B4FF; stroke-width: 0.5; fill: none; opacity: 0.04; }
  </style>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

